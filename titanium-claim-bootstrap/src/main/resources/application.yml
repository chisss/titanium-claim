spring:
  # 错误文案国际化（m30-07）：资源包位于 titanium-metadata 的 classpath:i18n/messages_*.properties，
  # basename 带 i18n/ 前缀而非裸 messages——裸 messages 会被 JDK ResourceBundle 在多个 jar 之间
  # 只取「第一个」命中者，第三方 jar 若也有根级 messages.properties 会静默顶掉本项目文案。
  messages:
    basename: i18n/messages
    encoding: UTF-8
  application:
    name: titanium-claim
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:8066/titanium_claim?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # JPA配置
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Hibernate 7（Spring Boot 4.0）：MySQL8Dialect 已废弃，统一用 MySQLDialect（自动探测版本）
        dialect: org.hibernate.dialect.MySQLDialect

  # Liquibase配置（DDL 交由 liquibase 管理）
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml

  # Kafka配置
  # ⚠️ producer 段不被 Spring 消费：本域依赖裸 spring-kafka（无 spring-boot-starter-kafka），
  #    Boot 的 Kafka 自动配置不激活，这里的 serializer 一律不生效。生产者参数的唯一事实来源是
  #    KafkaConfig#producerFactory（已显式置 acks=all / enable.idempotence / retries）。
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 入站统一 String 反序列化：防腐监听器 JSONObject.parseObject(payload, XxxMessage.class) 一次反序列化
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: titanium-claim-group

# Axon Framework配置
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      # ✅ m21-04（审查报告 ORC-01）：原 claim-group 死配置已删除（m6-909 实读登记的死配置，
      #    全仓无处理器声明该组名；真实读侧组名为 claim-query-group）。保留本行以留痕。
      # 读侧投影组（ClaimProjectionEventHandler / ClaimQueryHandler 的 @ProcessingGroup）。
      # 🔴 m6-915 上下文实测：本组未声明时 Axon 按**隐式 tracking** 装配（本项目 eventBus 为流式
      #    EmbeddedEventStore，未声明的组一律退化为 TrackingEventProcessor），但**拿不到 DLQ**
      #    （实测 dlqPresent=false）——读侧投影失败无重投，而 DeadLetterQueueService 的重投清单里
      #    早已含该组，每次扫描都静默跳过（空转）。故显式声明 + dlq.enabled 只是把「本已存在的
      #    tracking 形态」落到配置上并补上重投能力，**不改变任何读写一致性语义**（从来不是同步投影）。
      # ⚠️ 不登记进 titanium.axon.outbound-relay.groups：该机制是给出站组首启位点取事件流**末端**，
      #    而读侧投影组在全新部署时**需要**从头部重放以重建读模型（见 AxonOutboundRelayAutoConfiguration）。
      claim-query-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 10
      # 跨域出站组：tracking + DLQ，发布失败的事件由 DeadLetterQueueService 定时重投
      claim-kafka-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 1
      # 理赔赔付派发组（ClaimSettlementPaymentSaga）：调 PaymentServicePort 派发 payment-order-created，
      # 同样需 tracking + DLQ —— SubscribingEventProcessor 拿不到 SequencedDeadLetterQueue，
      # 发布失败只会上抛、无法重投（m6-913 补齐，此前该组未声明、无 DLQ）。
      claim-settlement-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 1
  persistence:
    event-store:
      emf-provider: axonConfiguration

# 服务器配置
server:
  port: 8083
  servlet:
    context-path: /claim

# 日志配置
logging:
  level:
    com.titanium.claim: debug
    org.axonframework: info
    org.springframework: info
    org.hibernate: info

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# 多租户配置
multi-tenant:
  enabled: true
  default-tenant: default-tenant

# 跨域出站中继：声明哪些处理组按「事件存储即 Outbox」形态装配为 tracking + DLQ，
# 并令其首启位点取事件流末端（避免首次部署重放全量历史事件）。
titanium:
  axon:
    outbound-relay:
      groups:
        - claim-kafka-group
        # 理赔赔付派发组同为出站组：首启位点须取事件流末端，否则全新部署时会把本域全部历史
        # 结算事件重放给 payment 域（虽有下游幂等兜底，但会产生大量无谓流量与日志）。
        - claim-settlement-group

  # ==========================================================================================
  # 分析型取数声明（G08/g08-06）——由 titanium-analytical-starter 消费，本域零 Java 代码。
  #
  # 🔴 YAML 是开发资产，不是运营配置（方案 R-3）：它声明「哪个字段落在哪张表的哪一列」，
  #    改它走代码评审 + 发版。运营配置的是特征定义（后台），不是取数映射。
  # 实体码 `claim` 与 t_entity_registry 登记行、字段目录 field_code 前缀三者一致；
  # 请求写 `claim.claimAmount`（starter 按首个点切分）⇒ 下方 code 一律**不含**实体码前缀。
  # ==========================================================================================
  analytical:
    # 🔴 init：首次启动把下方 catalog 声明一次性导入 t_claim_field_catalog（G07/g07-02e）。
    #    表非空即整体跳过、不比对不更新——此后表为权威，改 YAML 不会回写已灌种子的库；
    #    目录变更走属主域的发布流程（同 policy 的 g07-04 版本化路径），不是改 YAML 重启。
    seed-mode: init

    entities:
      claim:
        # CQRS 读模型表：取数走读侧垂直切片，绕过写侧聚合
        table: t_claim_view
        subject-column: claim_id
        # 🔴 如实声明：读模型有投影可见延迟 ⇒ EVENTUAL。与 t_entity_registry.consistency
        #    逐字一致，R-14 一致性对账据此比对。
        consistency: EVENTUAL
        # 读模型无删除标记列（投影不落逻辑删除）——这是**陈述事实**，不是关闭过滤的开关：
        # starter 会用 JDBC 元数据核验本表确无该列，核验不过即拒绝服务。
        deleted-column: none
        # 字段目录落点（G07/g07-02e 的种子导入目标）
        catalog-table: t_claim_field_catalog
        # 🔴 不声明 effective-from/to-column（读模型无数据时效列，asOf 如实回报 null）；
        #    allow-cross-subject 保持默认 false（最小暴露面，需跨主体聚合时改这一行=显式评审决策）。
        fields:
          # 字段集 = t_claim_view 全部列（21）− 主体列 claim_id（读模型无审计列），共 20 项。
          # 🔴 四项能力位与 G07 目录口径逐项对齐（2026-10-01 裁示，权威来源 = policy 的
          #    policy_field_catalog_analysis_seed_*.sql 的 CASE 谓词）：analyzable=全部 /
          #    aggregatable=非 TEXT / groupable=ENUM、DATE（本域无 collection 字段）/ filterable=全部。
          #    特别地 **DATETIME 不可分组**（裁示口径只含 ENUM/DATE，不含 DATETIME）——
          #    这不是笔误，两份声明（YAML 与目录）取值必须一致，否则即「目录说可分组、取数声明说不可分组」的静默漂移。
          # 🔴 敏感度全 INTERNAL/NONE：本域无任何掩码设施与掩码用法（涉敏文本如出险描述/拒赔原因
          #    域内按原样落库），目录声明必须与域内实况一致，不得凭空发明敏感级别。
          # 写侧能力位（proposable/clearable/execution-supported/requires-object-id）全 false：
          #    本域目录用途是分析取数，不参与保全申报；change-type-code 随之为空。
          - code: customerId
            column: customer_id
            type: STRING
            analyzable: true
            filterable: true
            catalog:
              object-type: CLAIM
              value-type: TEXT
              label-key: claim.field.customerId
              collection: false
              readable: true
              proposable: false
              clearable: false
              execution-supported: false
              requires-object-id: false
              sensitivity: INTERNAL
              masking-policy: NONE
          - code: policyId
            column: policy_id
            type: STRING
            analyzable: true
            filterable: true
            catalog:
              object-type: CLAIM
              value-type: TEXT
              label-key: claim.field.policyId
              collection: false
              readable: true
              proposable: false
              clearable: false
              execution-supported: false
              requires-object-id: false
              sensitivity: INTERNAL
              masking-policy: NONE
          - code: claimNumber
            column: claim_number
            type: STRING
            analyzable: true
            filterable: true
            catalog:
              object-type: CLAIM
              value-type: TEXT
              label-key: claim.field.claimNumber
              collection: false
              readable: true
