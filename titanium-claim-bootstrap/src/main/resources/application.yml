spring:
  application:
    name: titanium-claim
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:8066/titanium_claim?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # JPA配置
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Hibernate 7（Spring Boot 4.0）：MySQL8Dialect 已废弃，统一用 MySQLDialect（自动探测版本）
        dialect: org.hibernate.dialect.MySQLDialect

  # Liquibase配置（DDL 交由 liquibase 管理）
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: titanium-claim-group
      properties:
        spring.json.trusted.packages: com.titanium.claim

# Axon Framework配置
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      claim-group:
        mode: subscribing
        source: claimCreatedEventSource
  persistence:
    event-store:
      emf-provider: axonConfiguration

# 服务器配置
server:
  port: 8083
  servlet:
    context-path: /claim

# 日志配置
logging:
  level:
    com.titanium.claim: debug
    org.axonframework: info
    org.springframework: info
    org.hibernate: info

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 多租户配置
multi-tenant:
  enabled: true
  default-tenant: default-tenant
