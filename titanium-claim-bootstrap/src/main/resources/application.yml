spring:
  application:
    name: titanium-claim
  
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:8066/titanium_claim?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  # JPA配置
  jpa:
    hibernate:
      # Axon 系统表加 axon_ 前缀，业务表不受影响
      naming:
        physical-strategy: com.titanium.common.jpa.AxonTablePrefixPhysicalNamingStrategy
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Hibernate 7（Spring Boot 4.0）：MySQL8Dialect 已废弃，统一用 MySQLDialect（自动探测版本）
        dialect: org.hibernate.dialect.MySQLDialect

  # Liquibase配置（DDL 交由 liquibase 管理）
  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.xml

  # Kafka配置
  # ⚠️ producer 段不被 Spring 消费：本域依赖裸 spring-kafka（无 spring-boot-starter-kafka），
  #    Boot 的 Kafka 自动配置不激活，这里的 serializer 一律不生效。生产者参数的唯一事实来源是
  #    KafkaConfig#producerFactory（已显式置 acks=all / enable.idempotence / retries）。
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 入站统一 String 反序列化：防腐监听器 JSONObject.parseObject(payload, XxxMessage.class) 一次反序列化
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: titanium-claim-group

# Axon Framework配置
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      # ⚠️ 死配置（m6-909 实读登记，未改）：全仓无任何处理器声明组名 claim-group，亦不存在名为
      #    claimCreatedEventSource 的 Bean，故本段不生效。真实的读侧组名是 claim-query-group
      #    （见 ClaimProjectionEventHandler / ClaimQueryHandler 的 @ProcessingGroup）。
      claim-group:
        mode: subscribing
        source: claimCreatedEventSource
      # 跨域出站组：tracking + DLQ，发布失败的事件由 DeadLetterQueueService 定时重投
      claim-kafka-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 1
      # 理赔赔付派发组（ClaimSettlementPaymentSaga）：调 PaymentServicePort 派发 payment-order-created，
      # 同样需 tracking + DLQ —— SubscribingEventProcessor 拿不到 SequencedDeadLetterQueue，
      # 发布失败只会上抛、无法重投（m6-913 补齐，此前该组未声明、无 DLQ）。
      claim-settlement-group:
        mode: tracking
        dlq:
          enabled: true
          max-size: 1000
          cache:
            enabled: true
            size: 2048
        batchSize: 1
  persistence:
    event-store:
      emf-provider: axonConfiguration

# 服务器配置
server:
  port: 8083
  servlet:
    context-path: /claim

# 日志配置
logging:
  level:
    com.titanium.claim: debug
    org.axonframework: info
    org.springframework: info
    org.hibernate: info

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# 多租户配置
multi-tenant:
  enabled: true
  default-tenant: default-tenant

# 跨域出站中继：声明哪些处理组按「事件存储即 Outbox」形态装配为 tracking + DLQ，
# 并令其首启位点取事件流末端（避免首次部署重放全量历史事件）。
titanium:
  axon:
    outbound-relay:
      groups:
        - claim-kafka-group
        # 理赔赔付派发组同为出站组：首启位点须取事件流末端，否则全新部署时会把本域全部历史
        # 结算事件重放给 payment 域（虽有下游幂等兜底，但会产生大量无谓流量与日志）。
        - claim-settlement-group
